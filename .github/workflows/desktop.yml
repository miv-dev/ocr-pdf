name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      bundle_weights:
        description: "Ship the model weights inside the build (~1.4 GB, works offline)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: Occular-windows
          - os: macos-latest
            name: macos
            artifact: Occular-macos
          - os: ubuntu-22.04
            name: linux
            artifact: Occular-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Linux WebKitGTK for pywebview
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gir1.2-webkit2-4.0 \
                                  python3-gi python3-gi-cairo gir1.2-gtk-3.0
          python -m pip install pygobject

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Prefetch model weights
        if: inputs.bundle_weights
        run: python desktop/fetch_models.py

      - name: Build
        env:
          OCCULAR_BUNDLE_WEIGHTS: ${{ inputs.bundle_weights && '1' || '0' }}
        run: pyinstaller --noconfirm desktop/occular.spec

      - name: Package (Windows)
        if: matrix.name == 'windows'
        run: Compress-Archive -Path dist/Occular -DestinationPath Occular-windows.zip

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: |
          cd dist
          zip -qry ../Occular-macos.zip Occular.app

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: tar -czf Occular-linux.tar.gz -C dist Occular

      # One step, either shape of package — v4 refuses two uploads under the
      # same artifact name.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            Occular-*.zip
            Occular-*.tar.gz
          if-no-files-found: error
