#
# /etc/nginx/sites-available/occular
#
# Nginx serves the viewer itself and proxies only the two API routes.
# Requests are slow and large, which drives most of the settings here.
#

upstream occular {
    server unix:/run/occular/gunicorn.sock fail_timeout=0;
}

# One page at a time per client, with a small burst for the prefetch of the
# next page. Recognition is expensive — this is the main abuse guard.
limit_req_zone $binary_remote_addr zone=ocr:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=ocrconn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name ocr.example.com;

    # certbot --nginx will replace this block with a 301 to https
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ocr.example.com;

    ssl_certificate     /etc/letsencrypt/live/ocr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ocr.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # A 300 dpi page is roughly 3-12 MB of PNG.
    client_max_body_size 32m;
    client_body_buffer_size 1m;
    client_body_timeout 120s;

    access_log /var/log/nginx/occular.access.log;
    error_log  /var/log/nginx/occular.error.log;

    # ---- static viewer ----------------------------------------------------
    root /srv/occular;
    index index.html;

    location = /index.html {
        # The page is small and changes on deploy; don't let it stick.
        add_header Cache-Control "no-cache";
    }

    # pdf.js, shipped with the app rather than pulled from a CDN. Versioned by
    # path, so it can be cached hard.
    location /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    # ---- API --------------------------------------------------------------
    location = /ocr {
        limit_req zone=ocr burst=5 nodelay;
        limit_conn ocrconn 2;
        limit_req_status 429;

        proxy_pass http://occular;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer the whole upload before waking a worker, so a slow phone
        # connection can't hold an OCR process hostage.
        proxy_request_buffering on;

        # Recognition is slow. These must exceed gunicorn's own timeout.
        proxy_connect_timeout 10s;
        proxy_send_timeout 330s;
        proxy_read_timeout 330s;

        # The JSON reply is small; no need to buffer it to disk.
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://occular;
        access_log off;
    }

    # The viewer polls this while the models load on a cold worker.
    location = /models {
        proxy_pass http://occular;
        access_log off;
    }
}
